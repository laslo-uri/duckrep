<!doctype html>
<html lang="en">
  <head>
    <script>
      (function(){
        var t = localStorage.getItem('youpeak-theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
        else if (t === 'light') document.documentElement.classList.add('light');
        else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
        else document.documentElement.classList.add('light');
      })();
    </script>
    <style>
      html, body { margin: 0; background: #eef2f5; }
      html.dark, html.dark body { background: #121418; }
    </style>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=8" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="YouPeak is a local gym journal for activities, exercises, food, and body stats." />
    <title>YouPeak</title>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
