[package]
name = "duckrep"
version = "0.1.0"
description = "Duckrep - training and body stats journal (desktop)"
authors = ["Laslo Uri"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[lib]
name = "duckrep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
